<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Descubra o segredo mágico - Experiência interativa exclusiva">
    <title id="pageTitle">✨ Mágica - Descubra o Segredo</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            cursor: default;
            user-select: none;
        }

        /* ===== PARTICLES BACKGROUND ===== */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 150, 220, 0.4);
            border-radius: 50%;
            animation: float-particle linear infinite;
        }

        @keyframes float-particle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ===== PHASE INDICATOR ===== */
        .phase-indicator {
            position: fixed;
            top: 40px;
            display: flex;
            gap: 16px;
            z-index: 10;
        }

        .phase-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 150, 220, 0.4);
            background: transparent;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .phase-dot.active {
            background: linear-gradient(135deg, #ff6fb7, #c471f5);
            border-color: #ff6fb7;
            box-shadow: 0 0 20px rgba(255, 111, 183, 0.6), 0 0 40px rgba(255, 111, 183, 0.3);
            transform: scale(1.3);
        }

        .phase-dot.completed {
            background: linear-gradient(135deg, #ff6fb7, #c471f5);
            border-color: #c471f5;
            box-shadow: 0 0 12px rgba(196, 113, 245, 0.5);
        }

        /* ===== TOP TEXT ===== */
        .top-text {
            position: fixed;
            top: 80px;
            text-align: center;
            z-index: 10;
            transition: all 0.5s ease;
        }

        .phase-label {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 150, 220, 0.5);
            margin-bottom: 8px;
        }

        .instruction-text {
            font-size: 28px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.85);
            transition: all 0.5s ease;
            line-height: 1.5;
            padding: 0 20px;
        }

        .instruction-text span {
            color: #ff6fb7;
            font-weight: 600;
        }

        /* ===== FLOWER CONTAINER ===== */
        .flower-wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Glow ring behind flower */
        .glow-ring {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 111, 183, 0.15) 0%, transparent 70%);
            animation: pulse-glow 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0%, 100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        .flower-container {
            width: 320px;
            height: 320px;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-flower 1.8s ease-in-out infinite;
        }

        /* ===== ANIMAÇÃO DE PULSAR ===== */
        @keyframes pulse-flower {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
            }
        }

        .flower-container:hover {
            filter: brightness(1.15);
        }

        .flower-container:active {
            transform: scale(0.92);
            animation: none;
        }

        .flower-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(255, 111, 183, 0.4));
            pointer-events: none;
        }

        /* Spin animation class */
        .flower-container.spinning {
            animation: spin-flower 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes spin-flower {
            0% {
                transform: rotate(0deg) scale(1);
            }
            30% {
                transform: rotate(200deg) scale(1.15);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        /* Click ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 111, 183, 0.6);
            animation: ripple-expand 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes ripple-expand {
            0% {
                width: 50px;
                height: 50px;
                opacity: 1;
                transform: translate(-50%, -50%) scale(0);
            }
            100% {
                width: 400px;
                height: 400px;
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* ===== BOTTOM GATILHO TEXT ===== */
        .gatilho-text {
            position: fixed;
            bottom: 100px;
            text-align: center;
            z-index: 10;
            transition: all 0.5s ease;
        }

        .gatilho-main {
            font-size: 16px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
        }

        .gatilho-highlight {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(90deg, #ff6fb7, #c471f5, #ff6fb7);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s linear infinite;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* ===== CLICK COUNTER ===== */
        .click-counter {
            position: fixed;
            bottom: 50px;
            font-size: 14px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
            z-index: 10;
        }

        /* ===== FINAL CTA OVERLAY ===== */
        .cta-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .cta-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .cta-overlay .cta-emoji {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce-emoji 1.5s ease-in-out infinite;
        }

        @keyframes bounce-emoji {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .cta-overlay h2 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6fb7, #c471f5, #12c2e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            text-align: center;
            padding: 0 20px;
        }

        .cta-overlay p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
            max-width: 400px;
            line-height: 1.6;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 18px 50px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #ff6fb7, #c471f5);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 32px rgba(255, 111, 183, 0.4);
            animation: cta-pulse 2s ease-in-out infinite;
        }

        .cta-button:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 48px rgba(255, 111, 183, 0.6);
        }

        @keyframes cta-pulse {
            0%, 100% {
                box-shadow: 0 8px 32px rgba(255, 111, 183, 0.4);
            }
            50% {
                box-shadow: 0 8px 48px rgba(255, 111, 183, 0.7), 0 0 80px rgba(196, 113, 245, 0.3);
            }
        }

        .cta-button .arrow {
            font-size: 22px;
            transition: transform 0.3s ease;
        }

        .cta-button:hover .arrow {
            transform: translateX(5px);
        }

        /* ===== CONFETTI ===== */
        .confetti-piece {
            position: fixed;
            width: 8px;
            height: 8px;
            z-index: 99;
            pointer-events: none;
            animation: confetti-fall linear forwards;
        }

        @keyframes confetti-fall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg);
            }
        }

        /* ===== SPARKLES on click ===== */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle-out 0.8s ease-out forwards;
        }

        @keyframes sparkle-out {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* ===== ONLINE INDICATOR ===== */
        .online-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
        }

        .online-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ed573;
            box-shadow: 0 0 8px rgba(46, 213, 115, 0.8), 0 0 20px rgba(46, 213, 115, 0.4);
            animation: blink-dot 1.5s ease-in-out infinite;
        }

        @keyframes blink-dot {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 8px rgba(46, 213, 115, 0.8), 0 0 20px rgba(46, 213, 115, 0.4);
            }
            50% {
                opacity: 0.3;
                box-shadow: 0 0 4px rgba(46, 213, 115, 0.4);
            }
        }

        /* ===== FLOWER EMOJI ===== */
        .flower-emoji {
            font-size: 180px;
            line-height: 1;
            filter: drop-shadow(0 0 40px rgba(255, 111, 183, 0.5));
            pointer-events: none;
            text-align: center;
        }

        /* ===== CLICK AGAIN TEXT ===== */
        .click-again-text {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 15px;
            font-weight: 600;
            color: #ff6fb7;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 111, 183, 0.5);
        }

        .click-again-text.visible {
            opacity: 1;
            animation: bounce-text 1s ease-in-out infinite;
        }

        @keyframes bounce-text {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .flower-container {
                width: 250px;
                height: 250px;
            }
            .flower-emoji {
                font-size: 140px;
            }
            .glow-ring {
                width: 320px;
                height: 320px;
            }
            .cta-overlay h2 {
                font-size: 24px;
            }
            .instruction-text {
                font-size: 22px;
                padding: 0 20px;
            }
            .gatilho-highlight {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Phase Indicator -->
    <div class="phase-indicator" id="phaseIndicator">
        <div class="phase-dot active" id="dot1"></div>
        <div class="phase-dot" id="dot2"></div>
        <div class="phase-dot" id="dot3"></div>
    </div>

    <!-- Top Instruction Text -->
    <div class="top-text">
        <div class="phase-label" id="phaseLabel">FASE 1 DE 3</div>
        <div class="instruction-text" id="instructionText"></div>
    </div>

    <!-- Flower -->
    <div class="flower-wrapper">
        <div class="glow-ring"></div>
        <div class="flower-container" id="flower">
            <div class="flower-emoji" id="mainEmoji"></div>
            <div class="click-again-text" id="clickAgainText">👆 Clica de novo!</div>
        </div>
    </div>

    <!-- Bottom Gatilho Text -->
    <div class="gatilho-text">
        <div class="gatilho-main" id="gatilhoMain"></div>
        <div class="gatilho-highlight" id="gatilhoHighlight"></div>
    </div>

    <!-- Click Counter -->
    <div class="click-counter" id="clickCounter">0 / 3</div>

    <!-- CTA Overlay (after 3 clicks) -->
    <div class="cta-overlay" id="ctaOverlay">
        <div class="cta-emoji" id="ctaEmoji"></div>
        <h2>Você desbloqueou!</h2>
        <p>Toque no botão abaixo estou online agora!</p>
        <a href="https://t.me/mamazinhaefilha_bot"_blank" class="cta-button" id="ctaButton">
            Clica Aqui
            <span class="arrow">→</span>
        </a>
        <div class="online-indicator">
            <div class="online-dot"></div>
            <span>Online agora</span>
        </div>
    </div>

    <script>
        // ===== EMOJI POOL =====
        // Cada emoji tem um nome descritivo em português
        const emojiPool = [
            { emoji: '🌸', name: 'flor mágica' },
            { emoji: '🔥', name: 'fogo mágico' },
            { emoji: '⭐', name: 'estrela mágica' },
            { emoji: '🦋', name: 'borboleta mágica' },
            { emoji: '🌙', name: 'lua mágica' },
            { emoji: '💎', name: 'diamante mágico' },
            { emoji: '🍀', name: 'trevo mágico' },
            { emoji: '🎭', name: 'máscara mágica' },
            { emoji: '🌈', name: 'arco-íris mágico' },
            { emoji: '👁️', name: 'olho mágico' },
            { emoji: '🐉', name: 'dragão mágico' },
            { emoji: '🪷', name: 'lótus mágica' },
            { emoji: '🫧', name: 'bolha mágica' },
            { emoji: '🧿', name: 'amuleto mágico' },
            { emoji: '💫', name: 'centelha mágica' },
            { emoji: '🪐', name: 'planeta mágico' },
            { emoji: '🌺', name: 'hibisco mágico' },
            { emoji: '❄️', name: 'cristal mágico' },
            { emoji: '🔮', name: 'bola mágica' },
            { emoji: '🎪', name: 'circo mágico' },
        ];

        // Escolhe um emoji aleatório a cada visita
        const chosen = emojiPool[Math.floor(Math.random() * emojiPool.length)];
        const CHOSEN_EMOJI = chosen.emoji;
        const CHOSEN_NAME = chosen.name;

        // ===== CONFIG =====
        const TOTAL_PHASES = 3;
        let currentClicks = 0;

        // ===== ELEMENTS =====
        const flower = document.getElementById('flower');
        const phaseLabel = document.getElementById('phaseLabel');
        const instructionText = document.getElementById('instructionText');
        const gatilhoMain = document.getElementById('gatilhoMain');
        const gatilhoHighlight = document.getElementById('gatilhoHighlight');
        const clickCounter = document.getElementById('clickCounter');
        const ctaOverlay = document.getElementById('ctaOverlay');
        const mainEmoji = document.getElementById('mainEmoji');
        const ctaEmoji = document.getElementById('ctaEmoji');
        const dots = [
            document.getElementById('dot1'),
            document.getElementById('dot2'),
            document.getElementById('dot3')
        ];

        // ===== SET EMOJI EVERYWHERE =====
        mainEmoji.textContent = CHOSEN_EMOJI;
        ctaEmoji.textContent = CHOSEN_EMOJI;
        document.title = CHOSEN_EMOJI + ' ' + CHOSEN_NAME.charAt(0).toUpperCase() + CHOSEN_NAME.slice(1) + ' - Descubra o Segredo';

        // ===== PHASE MESSAGES (dinâmicos com o emoji/nome escolhido) =====
        const phaseMessages = [
            {
                label: 'FASE 1 DE 3',
                instruction: 'Toque na <span>' + CHOSEN_NAME + '</span> ' + CHOSEN_EMOJI,
                gatilho: '',
                highlight: '✨ Descubra o segredo ✨'
            },
            {
                label: 'FASE 2 DE 3',
                instruction: 'A ' + CHOSEN_NAME + ' está <span>ganhando energia!</span> ⚡',
                gatilho: '',
                highlight: '🔮 Continue, está quase lá! 🔮'
            },
            {
                label: 'FASE 3 DE 3',
                instruction: 'Último toque! <span>Liberte o poder!</span> 💫',
                gatilho: '',
                highlight: '🌟 Toque agora e descubra! 🌟'
            }
        ];

        // ===== CREATE PARTICLES =====
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (6 + Math.random() * 10) + 's';
                p.style.animationDelay = (Math.random() * 8) + 's';
                p.style.width = (2 + Math.random() * 3) + 'px';
                p.style.height = p.style.width;

                const colors = [
                    'rgba(255, 150, 220, 0.4)',
                    'rgba(196, 113, 245, 0.3)',
                    'rgba(18, 194, 233, 0.3)',
                    'rgba(255, 255, 255, 0.2)'
                ];
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(p);
            }
        }

        // ===== SPARKLES ON CLICK =====
        function createSparkles(x, y) {
            const wrapper = document.querySelector('.flower-wrapper');
            const rect = wrapper.getBoundingClientRect();
            const count = 12;

            for (let i = 0; i < count; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';

                const angle = (360 / count) * i;
                const distance = 60 + Math.random() * 80;
                const tx = Math.cos(angle * Math.PI / 180) * distance;
                const ty = Math.sin(angle * Math.PI / 180) * distance;

                sparkle.style.setProperty('--tx', tx + 'px');
                sparkle.style.setProperty('--ty', ty + 'px');
                sparkle.style.left = (x - rect.left) + 'px';
                sparkle.style.top = (y - rect.top) + 'px';

                const colors = ['#ff6fb7', '#c471f5', '#12c2e9', '#fff', '#ffd700'];
                sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];

                wrapper.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 800);
            }
        }

        // ===== RIPPLE EFFECT =====
        function createRipple(x, y) {
            const wrapper = document.querySelector('.flower-wrapper');
            const rect = wrapper.getBoundingClientRect();
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = (x - rect.left) + 'px';
            ripple.style.top = (y - rect.top) + 'px';
            wrapper.appendChild(ripple);
            setTimeout(() => ripple.remove(), 1000);
        }

        // ===== CONFETTI BURST =====
        function createConfetti() {
            const colors = ['#ff6fb7', '#c471f5', '#12c2e9', '#ffd700', '#ff4757', '#2ed573', '#fff'];
            for (let i = 0; i < 60; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.top = '-10px';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                piece.style.width = (5 + Math.random() * 8) + 'px';
                piece.style.height = (5 + Math.random() * 8) + 'px';
                piece.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                piece.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 4000);
            }
        }

        // ===== UPDATE UI =====
        function updateUI() {
            const phase = currentClicks;

            // Update counter
            clickCounter.textContent = currentClicks + ' / ' + TOTAL_PHASES;

            // Update dots
            dots.forEach((dot, i) => {
                dot.classList.remove('active', 'completed');
                if (i < currentClicks) {
                    dot.classList.add('completed');
                } else if (i === currentClicks) {
                    dot.classList.add('active');
                }
            });

            // Update texts
            if (phase < TOTAL_PHASES) {
                const msg = phaseMessages[phase];
                phaseLabel.textContent = msg.label;
                instructionText.innerHTML = msg.instruction;
                gatilhoMain.textContent = msg.gatilho;
                gatilhoHighlight.textContent = msg.highlight;
            }
        }

        // ===== FLOWER CLICK HANDLER =====
        // Permite cliques rápidos sem esperar animação de spin
        flower.addEventListener('click', function (e) {
            if (currentClicks >= TOTAL_PHASES) return;

            // Hide click again text
            document.getElementById('clickAgainText').classList.remove('visible');

            // Visual effects
            createSparkles(e.clientX, e.clientY);
            createRipple(e.clientX, e.clientY);

            // Quick spin animation (restart se clicar antes de acabar)
            flower.classList.remove('spinning');
            void flower.offsetWidth;
            flower.classList.add('spinning');

            currentClicks++;
            updateUI();

            // Check if all phases done
            if (currentClicks >= TOTAL_PHASES) {
                // Remove animation and show overlay quickly
                setTimeout(() => {
                    flower.classList.remove('spinning');
                    document.getElementById('clickAgainText').classList.remove('visible');
                    createConfetti();
                    ctaOverlay.classList.add('visible');
                }, 300);
            } else {
                // Show "clica de novo" text after short delay
                setTimeout(() => {
                    flower.classList.remove('spinning');
                    document.getElementById('clickAgainText').classList.add('visible');
                }, 500);
            }
        });

        // ===== INIT =====
        createParticles();
        updateUI();
    </script>
</body>
</html>
